    <path d="M 330,735 C 260,670 190,560 190,420 C 220,440 260,520 300,610 C 320,655 335,700 330,735 Z" fill="url(#sutraGoldVert)" />
    <path d="M 345,610 C 320,530 270,395 240,320 C 275,345 320,430 345,520 C 350,545 352,580 345,610 Z" fill="url(#sutraGoldVert)" />

    <path d="M 610,795 C 680,785 805,750 885,670 C 950,605 965,535 955,540 C 920,540 850,600 780,680 C 730,735 670,775 610,795 Z" fill="url(#sutraGoldVert)" />
    <path d="M 670,735 C 740,670 810,560 810,420 C 780,440 740,520 700,610 C 680,655 665,700 670,735 Z" fill="url(#sutraGoldVert)" />
    <path d="M 655,610 C 680,530 730,395 760,320 C 725,345 680,430 655,520 C 650,545 648,580 655,610 Z" fill="url(#sutraGoldVert)" />

    <path d="M 235,845 C 300,835 380,838 440,855 C 380,858 300,862 235,845 Z" fill="url(#sutraGoldVert)" />
    <path d="M 765,845 C 700,835 620,838 560,855 C 620,858 700,862 765,845 Z" fill="url(#sutraGoldVert)" />
    <polygon points="500,820 558,890 500,968 442,890" fill="url(#sutraGoldVert)" />
