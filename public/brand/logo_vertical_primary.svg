  <!-- Typography Stacked (Matching sutra-logo-vertical.png) -->
  <!-- SUTRA (Gold) -->
  <text
    x="250"
    y="410"
    text-anchor="middle"
    fill="url(#sutraGoldVert)"
    font-family="'Playfair Display', Georgia, serif"
    font-size="64"
    font-weight="700"
    letter-spacing="6"
