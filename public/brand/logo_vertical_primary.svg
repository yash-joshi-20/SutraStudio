  </text>

  <!-- Dividing Line with Diamond -->
  <line x1="75" y1="520" x2="225" y2="520" stroke="url(#sutraGoldVert)" stroke-width="1.2" opacity="0.8" />
  <polygon points="250,514 256,520 250,526 244,520" fill="url(#sutraGoldVert)" />
  <line x1="275" y1="520" x2="425" y2="520" stroke="url(#sutraGoldVert)" stroke-width="1.2" opacity="0.8" />

