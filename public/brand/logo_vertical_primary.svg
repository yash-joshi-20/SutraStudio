  </text>

  <!-- Tagline: DEVELOPMENT ◆ GROWTH -->
  <text
    x="250"
    y="595"
    text-anchor="middle"
    fill="#475569"
    font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="14"
    font-weight="600"
    letter-spacing="4"
